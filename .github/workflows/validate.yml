name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check frontmatter and repo rules
        run: python3 tools/validate_skills.py
      - name: Check INDEX.md and index.json are regenerated
        run: python3 tools/build_index.py --check
